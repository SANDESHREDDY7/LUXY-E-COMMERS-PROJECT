# Production profile (activate with SPRING_PROFILES_ACTIVE=prod)
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# H2 console off in production
spring.h2.console.enabled=false

# CORS for Netlify frontend (e.g. https://your-site.netlify.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Mail
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Stripe
stripe.api.secret.key=${STRIPE_SECRET_KEY:sk_test_PLACEHOLDER}
stripe.api.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_PLACEHOLDER}

